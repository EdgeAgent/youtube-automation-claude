# Niche preset: science / facts
# Pick it at setup; the pipeline reads these values at every stage.

niche: science / facts
summary: Countdowns, myth-busting, and the fact that rewires your brain.
format_lean: shorts-first

winning_types:
  - myth_bust
  - number_reveal
  - secret
  - impossible_fact
  - countdown_payoff
reject_types:
  - fact_list_no_payoff
  - pseudoscience
  - unsourced_claim
  - filler_travel
min_ship_score: 8

video_types:
  - shorts
  - long-form
cadence: daily shorts, 1 countdown long-form per week

title_style: The claim that sounds wrong — the video proves it.
thumbnail_style: The subject at its most extreme, the counterintuitive number in huge type.
subscribe_line: 🔔 SUBSCRIBE for a fact a day that rewires your brain! 🚀

canonical_tags:
  - science facts
  - did you know
  - myth busting
  - amazing facts
  - how things work
hashtags:
  - science
  - facts
  - shorts

sources:
  - Your own narration, graphics, and demonstrations
  - Public-domain agency footage (e.g. space and science agencies' public archives) used within their terms
  - Openly licensed stock for illustration
feed_method: Build each video from your script and your graphics; keep the paper or source link for every claim in the description.
rights_note: Facts are free; footage is not. Agency public archives are generous but still have terms — read them per source.

cautions:
  - Every claim needs a source you actually read
  - No pseudoscience dressed as fact, even for views
  - Correct errors loudly in a pinned comment
