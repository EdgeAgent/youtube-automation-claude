# Niche preset: interviews / talk
# Pick it at setup; the pipeline reads these values at every stage.

niche: interviews / talk
summary: The answer nobody expected, from conversations you host or license.
format_lean: both

winning_types:
  - unexpected_answer
  - confession
  - argument_peak
  - story_payoff
  - secret
reject_types:
  - small_talk
  - promo_segment
  - inside_reference
  - filler_travel
min_ship_score: 8

video_types:
  - shorts
  - long-form
cadence: 2-3 shorts per interview, 1 full interview per week

title_style: The question or the claim — the guest's most quotable line, teased honestly.
thumbnail_style: Guest mid-reaction, the topic in 3-4 words.
subscribe_line: 🔔 SUBSCRIBE for the answers nobody expected — new interviews weekly! 🚀

canonical_tags:
  - interview clips
  - best interview moments
  - talk show moments
  - celebrity interview
hashtags:
  - interview
  - shorts

sources:
  - Interviews you host and record yourself
  - Shows that licensed you clip rights in writing
  - Press junkets where clip use is part of the access terms
feed_method: Record your own sessions locally; for licensed shows, keep the licence with the episode files.
rights_note: A famous guest does not transfer rights. Network talk shows are among the most protected footage on the platform.

cautions:
  - Release forms for every guest, every time
  - Do not re-cut answers to change their meaning
  - Right of reply for contested claims
