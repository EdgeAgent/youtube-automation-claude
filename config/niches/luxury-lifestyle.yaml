# Niche preset: luxury / high-end lifestyle
# Pick it at setup; the pipeline reads these values at every stage.

niche: luxury / high-end lifestyle
summary: Craft, access, and the details that justify the price — or don't.
format_lean: both

winning_types:
  - detail_reveal
  - comparison_verdict
  - secret
  - transformation
  - myth_bust
reject_types:
  - flex_no_substance
  - logo_montage
  - fake_rich_staging
  - filler_travel
min_ship_score: 8

video_types:
  - shorts
  - long-form
cadence: 3 shorts per week, 1 deep-dive per week

title_style: The detail or the verdict — price alone is not a hook.
thumbnail_style: The macro detail shot (stitching, movement, finish), one precise claim.
subscribe_line: 🔔 SUBSCRIBE for luxury with the receipts — details, not flexing! 🚀

canonical_tags:
  - luxury
  - watch review
  - luxury lifestyle
  - high end
  - worth it
hashtags:
  - luxury
  - shorts

sources:
  - Items you own or were loaned, filmed by you
  - Boutique and atelier visits where filming was agreed
  - Brand press material used within its licence
feed_method: Film your own pieces locally; keep loan agreements and brand terms with the footage.
rights_note: Your pieces, your footage. Brand campaign films and other creators' boutique tours are licensed material, not B-roll for you.

cautions:
  - Disclose loans, gifts, and sponsorships
  - No rented-flex presented as owned
  - Verify provenance claims before repeating them
