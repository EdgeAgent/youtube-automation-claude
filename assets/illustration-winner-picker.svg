<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Illustration of the winner picker scorecard">
  <rect width="720" height="400" rx="14" fill="#0d1117"/>
  <rect width="720" height="400" rx="14" fill="none" stroke="#2b3444"/>
  <text x="36" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">WINNER PICKER &#8212; SCORECARD</text>
  <text x="36" y="78" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b95a5">Five questions, 0&#8211;2 each. Ship only at 8+.</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#dfe5ee">
    <text x="36" y="128">Winning moment type?</text>
    <text x="36" y="176">Hook in the FIRST frame?</text>
    <text x="36" y="224">Title curiosity, no spoiler?</text>
    <text x="36" y="272">Would a stranger finish it?</text>
    <text x="36" y="320">Beats the channel average?</text>
  </g>

  <g>
    <!-- row template: 3 segment slots starting x=400, each 62 wide -->
    <!-- row 1: 2/2 -->
    <rect x="400" y="106" width="62" height="24" rx="6" fill="#2ea043"/><rect x="470" y="106" width="62" height="24" rx="6" fill="#2ea043"/><rect x="540" y="106" width="62" height="24" rx="6" fill="#232a36"/>
    <!-- row 2: 2/2 -->
    <rect x="400" y="154" width="62" height="24" rx="6" fill="#2ea043"/><rect x="470" y="154" width="62" height="24" rx="6" fill="#2ea043"/><rect x="540" y="154" width="62" height="24" rx="6" fill="#232a36"/>
    <!-- row 3: 2/2 -->
    <rect x="400" y="202" width="62" height="24" rx="6" fill="#2ea043"/><rect x="470" y="202" width="62" height="24" rx="6" fill="#2ea043"/><rect x="540" y="202" width="62" height="24" rx="6" fill="#232a36"/>
    <!-- row 4: 1/2 -->
    <rect x="400" y="250" width="62" height="24" rx="6" fill="#2ea043"/><rect x="470" y="250" width="62" height="24" rx="6" fill="#232a36"/><rect x="540" y="250" width="62" height="24" rx="6" fill="#232a36"/>
    <!-- row 5: 2/2 -->
    <rect x="400" y="298" width="62" height="24" rx="6" fill="#2ea043"/><rect x="470" y="298" width="62" height="24" rx="6" fill="#2ea043"/><rect x="540" y="298" width="62" height="24" rx="6" fill="#232a36"/>
  </g>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b95a5">
    <text x="616" y="123">2</text><text x="616" y="171">2</text><text x="616" y="219">2</text><text x="616" y="267">1</text><text x="616" y="315">2</text>
  </g>

  <rect x="0" y="344" width="720" height="1.5" fill="#2b3444"/>
  <text x="36" y="380" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">TOTAL 9 / 10</text>
  <g transform="translate(560,352)">
    <rect width="124" height="34" rx="17" fill="#2ea043"/>
    <text x="62" y="23" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">>SHIP IT</text>
  </g>
</svg>
