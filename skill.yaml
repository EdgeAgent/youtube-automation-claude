name: youtube_automation
title: YouTube Automation for Muse
description: A niche-agnostic YouTube pipeline an agent can run end to end — it makes the videos AND packages them. Winner-only moment selection (self-score /10, ship at 8+), then real production with ffmpeg on footage the user supplies locally (clip cutting at the selected timestamps, vertical 9:16 Shorts in blur-pad or crop, burned captions from SRT, compilations assembled best-clip-last, loudness-safe audio), full SEO packs (curiosity-gap titles, hook-first descriptions, tags filled to ~490-500 chars), thumbnails built from real frames of the user's own video, and a pre-publish QC gate that refuses failing items. The user picks a niche from the built-in library of 28 presets in config/niches/ (each with winning types, tag seeds, sources, and cautions) or writes a custom one from config/niche.example.yaml. Publishing is a human step in YouTube Studio, verified by read-back. Use when the user wants to start or run a YouTube channel with this repo, choose a niche, produce or package a video, or audit a channel's packaging. Do NOT use for uploading or posting on the user's behalf, for downloading or scraping footage, for footage the user has no rights to, or with any promise of views or monetization.
include_in_prompt: true
availability:
  confidential_vm: true
  needs_speech: false
